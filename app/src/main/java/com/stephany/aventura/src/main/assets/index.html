
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEPHANY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#172554,#0284c7,#86efac);font-family:Arial;color:white;text-align:center;overflow:hidden}
h1{font-size:38px;text-shadow:0 3px 8px #000;margin:24px 0 5px}
p{margin:8px}
#hud{display:flex;justify-content:space-around;padding:12px;font-weight:bold}
canvas{display:block;width:100%;height:55vh}
button{background:#facc15;color:#172554;border:0;border-radius:14px;padding:14px 22px;font-size:18px;font-weight:bold;margin:8px}
</style>
</head>
<body>
<h1>STEPHANY</h1>
<p>¡Corre, salta y recoge monedas!</p>
<div id="hud"><span id="coins">🪙 0</span><span id="distance">📍 0 m</span></div>
<canvas id="game"></canvas>
<button onclick="jump()">SALTAR</button>
<button onclick="start()">JUGAR</button>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
let playerY=0,velocity=0,coins=0,distance=0,running=false,obstacles=[];
function resize(){c.width=innerWidth;c.height=Math.floor(innerHeight*.55)}
addEventListener('resize',resize);resize();
function start(){coins=0;distance=0;obstacles=[];running=true;requestAnimationFrame(loop)}
function jump(){if(playerY===0)velocity=-14}
function loop(){
 if(!running)return;
 distance++;
 if(Math.random()<.025)obstacles.push({x:c.width,y:c.height*.76,coin:Math.random()<.6});
 velocity+=.65;playerY=Math.min(0,playerY+velocity);if(playerY===0)velocity=0;
 x.clearRect(0,0,c.width,c.height);
 x.fillStyle='#166534';x.fillRect(0,c.height*.8,c.width,c.height*.2);
 x.fillStyle='#fef3c7';x.beginPath();x.arc(c.width*.2,c.height*.7+playerY,22,0,Math.PI*2);x.fill();
 x.fillStyle='#1e3a8a';x.fillRect(c.width*.2-15,c.height*.72+playerY,30,35);
 obstacles.forEach(o=>{o.x-=6;x.font='30px Arial';x.fillText(o.coin?'🪙':'🪨',o.x,o.y);if(o.coin&&Math.abs(o.x-c.width*.2)<25){coins++;o.coin=false}});
 obstacles=obstacles.filter(o=>o.x>-40);
 document.getElementById('coins').textContent='🪙 '+coins;
 document.getElementById('distance').textContent='📍 '+distance+' m';
 requestAnimationFrame(loop);
}
</script>
</body>
</html>
